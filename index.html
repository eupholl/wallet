<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Portfolio Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #0b0e14; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
        .balance { text-align: center; font-size: 32px; font-weight: bold; margin-bottom: 10px; }
        input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #1e232d; background: #151a21; color: #fff; text-align: center; outline: none; }
        button { width: 100%; padding: 14px; border-radius: 12px; border: none; background: #0098ea; color: #fff; font-weight: bold; cursor: pointer; }
        .card { background: #151a21; padding: 14px; border-radius: 14px; border: 1px solid #1e232d; display: flex; justify-content: space-between; }
        .scam { border-color: rgba(255, 69, 58, 0.3); color: #ff453a; }
        #loader { display: none; text-align: center; color: #0098ea; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="balance" id="total-ton">0.00 GRAM</div>
        <input type="text" id="wallet-input" placeholder="Введите адрес кошелька...">
        <button type="button" onclick="checkWallet()">Проверить</button>
        <div id="loader">Загрузка...</div>
        <div class="card"><span>888 Номера</span><span id="v-888">0 GRAM</span></div>
        <div class="card"><span>Usernames</span><span id="v-user">0 GRAM</span></div>
        <div class="card"><span>NFT Коллекции</span><span id="v-nft">0 GRAM</span></div>
        <div class="card scam"><span>Scam</span><span id="v-scam">0 шт</span></div>
    </div>

    <script>
        async function checkWallet() {
            var addr = document.getElementById('wallet-input').value.trim();
            if (!addr) { alert('Введите адрес!'); return; }
            document.getElementById('loader').style.display = 'block';
            try {
                var res = await fetch('https://tonapi.io/v2/accounts/' + encodeURIComponent(addr));
                if (!res.ok) throw new Error();
                var data = await res.json();
                var bal = (data.balance || 0) / 1e9;
                document.getElementById('total-ton').innerText = bal.toFixed(2) + ' GRAM';
            } catch (e) {
                alert('Ошибка загрузки кошелька');
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }
    </script>
</body>
</html>
