<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Portfolio Tracker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #0b0e14; color: #ffffff; padding: 16px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; }
        .main-balance { text-align: center; padding: 12px 0 20px 0; }
        .balance-ton { font-size: 38px; font-weight: 800; color: #ffffff; }
        .balance-usd { font-size: 16px; color: #707a8a; margin-top: 4px; }
        .input-group { display: flex; flex-direction: column; gap: 10px; }
        input { width: 100%; padding: 16px; border-radius: 16px; border: 1px solid #1e232d; background: #151a21; color: white; font-size: 15px; outline: none; text-align: center; }
        .btn-check { width: 100%; background: linear-gradient(135deg, #0098ea 0%, #007bc1 100%); color: white; border: none; border-radius: 16px; padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .card { background-color: #151a21; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; border: 1px solid #1e232d; }
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-size: 16px; font-weight: 600; }
        .card-value { font-size: 15px; font-weight: 700; color: #0098ea; }
        .card-subtext { font-size: 11px; color: #707a8a; text-align: right; }
        .scam-card { border-color: rgba(255, 69, 58, 0.2); background-color: rgba(255, 69, 58, 0.03); }
        .scam-title { color: #ff453a; }
        .loader { display: none; text-align: center; font-size: 13px; color: #0098ea; padding: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-balance">
            <div class="balance-ton" id="total-ton">0.00 GRAM</div>
            <div class="balance-usd" id="total-usd">~$0.00</div>
        </div>
        <div class="input-group">
            <input type="text" id="wallet-input" placeholder="Адрес GRAM или .gram...">
            <button class="btn-check" id="check-btn">Проверить</button>
        </div>
        <div class="loader" id="loader">⏳ Получаем данные из сети...</div>
        <div class="card">
            <div class="card-header"><span class="card-title">888 Номера</span><span class="card-value" id="val-888">0 GRAM ≈ $0</span></div>
            <div class="card-subtext" id="count-888">найдено 0 штук</div>
        </div>
        <div class="card">
            <div class="card-header"><span class="card-title">Usernames</span><span class="card-value" id="val-user">0 GRAM ≈ $0</span></div>
            <div class="card-subtext" id="count-user">найдено 0 штук</div>
        </div>
        <div class="card">
            <div class="card-header"><span class="card-title">NFT Коллекции</span><span class="card-value" id="val-nft">0 GRAM ≈ $0</span></div>
            <div class="card-subtext" id="count-nft">найдено 0 штук</div>
        </div>
        <div class="card scam-card">
            <div class="card-header"><span class="card-title scam-title">Scam</span><span class="card-value" style="color: #ff453a;" id="val-scam">Скрыто</span></div>
            <div class="card-subtext" style="color: #ff453a;" id="count-scam">найдено 0 штук</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
